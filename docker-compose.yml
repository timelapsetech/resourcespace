services:
  resourcespace:
    build: .
    container_name: resourcespace
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    # Optional direct host access for debugging. Behind Nginx Proxy Manager you can
    # comment these out and only reach the app via the proxy hostname.
    ports:
      - "${RS_HTTP_PORT:-8080}:80"
    env_file:
      - docker/db.env
    environment:
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
    volumes:
      - ${FILESTORE_HOST_PATH}:/var/www/html/filestore
      - ${ORIGINALS_HOST_PATH}:/data/originals:ro
      - ${SYNCDIR_HOST_PATH}:/data/syncdir
      - ./docker/config.php:/var/www/html/include/config.php
    networks:
      - proxied
      - backend

  mariadb:
    image: mariadb:11.4
    container_name: resourcespace-mariadb
    restart: unless-stopped
    env_file:
      - docker/db.env
    # Optional host access for DB tools (TablePlus, etc.). App still uses mariadb:3306 on backend.
    ports:
      - "${MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - ${MYSQL_DATA_HOST_PATH:-mariadb_data}:/var/lib/mysql
    networks:
      # DB stays on the private compose network only (not exposed to the proxy net)
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # Pre-existing Docker network shared with Nginx Proxy Manager
  proxied:
    external: true
  backend:

volumes:
  mariadb_data:
